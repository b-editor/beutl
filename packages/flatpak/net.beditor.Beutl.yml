app-id: net.beditor.Beutl
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: beutl

finish-args:
  # Avalonia has only an X11 backend on Linux, so always mount the X11 socket (--socket=fallback-x11 is
  # suppressed on Wayland hosts); --device=dri gives Skia the GPU. --socket=wayland is kept for future
  # Wayland support, and --share=ipc is needed by X11 MIT-SHM.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Audio playback during preview/export (PulseAudio/PipeWire via the pulse socket).
  - --socket=pulseaudio
  # Network for the Beutl API client (extension/package manager, update check, telemetry exporter).
  - --share=network
  # Full host filesystem access: covers project files anywhere on disk, external
  # drives (/run/media, /media, /mnt), and host fonts/fontconfig.
  - --filesystem=host
  # Install the official single-file update bundle using the host's Flatpak.
  # flatpak-spawn --host needs this interface; the portal only updates remote refs.
  - --talk-name=org.freedesktop.Flatpak

# No top-level cleanup: the module only copies the prebuilt output.

modules:
  - name: beutl
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/beutl
      - cp -r beutl-bin/. /app/lib/beutl/
      - install -Dm644 beutl-bin/LICENSE "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/beutl/LICENSE"
      - install -Dm644 beutl-bin/LICENSE.GPL "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/beutl/LICENSE.GPL"
      - install -Dm644 beutl-bin/LICENSE.FFmpegWorker "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/beutl/LICENSE.FFmpegWorker"
      - install -Dm644 beutl-bin/THIRD_PARTY_NOTICES.md "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/beutl/THIRD_PARTY_NOTICES.md"
      - chmod +x /app/lib/beutl/Beutl
      - chmod +x /app/lib/beutl/Beutl.ExceptionHandler
      - chmod +x /app/lib/beutl/Beutl.PackageTools.UI
      - chmod +x /app/lib/beutl/Beutl.FFmpegWorker
      - install -Dm755 beutl-launcher.sh /app/bin/beutl
      - install -Dm644 net.beditor.Beutl.desktop /app/share/applications/net.beditor.Beutl.desktop
      - install -Dm644 net.beditor.Beutl.metainfo.xml /app/share/metainfo/net.beditor.Beutl.metainfo.xml
      - install -Dm644 net.beditor.Beutl.svg /app/share/icons/hicolor/scalable/apps/net.beditor.Beutl.svg
    sources:
      - type: dir
        path: sources/Beutl-linux-standalone
        dest: beutl-bin
      - type: file
        path: beutl-launcher.sh
      - type: file
        path: net.beditor.Beutl.desktop
      - type: file
        path: net.beditor.Beutl.metainfo.xml
      - type: file
        path: net.beditor.Beutl.svg
