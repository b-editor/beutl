<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Preview · Beutl</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="viewer.js" type="module"></script>
</head>
<body>
  <main id="pairing">
    <form id="pair-form">
      <div class="brand"><img src="logo.svg" width="28" height="28" alt=""><span>Beutl</span></div>
      <h1 id="title" data-text="code">Connection code</h1>
      <p data-text="instructions">Enter the 6-digit code shown in Beutl.</p>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-labelledby="title" aria-describedby="pair-status" required>
      <button id="pair-button" type="submit" data-text="connect">Connect</button>
      <p id="pair-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <section id="viewer" hidden aria-label="Beutl preview">
    <video id="frame" autoplay playsinline muted disablepictureinpicture></video>
    <div id="connection" role="status" aria-live="polite" hidden></div>
    <div id="controls" class="controls">
      <div class="seek-row">
        <input id="seek" type="range" min="0" max="0" step="any" value="0" data-label="seek" disabled>
        <output id="time" aria-live="off">0:00.00 / 0:00</output>
        <span id="range" hidden>HDR</span>
      </div>
      <div class="toolbar">
        <div class="transport">
          <button id="previous" type="button" data-label="previous" data-remote disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5 8 12l10 7Z" /></svg></button>
          <button id="play" type="button" data-label="play" data-remote disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-icon" d="m8 5 11 7-11 7Z" /><path class="pause-icon" d="M8 5v14M16 5v14" /></svg>
          </button>
          <button id="next" type="button" data-label="next" data-remote disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l10 7-10 7Z" /></svg></button>
        </div>
        <button id="audio" type="button" data-label="audioOn" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z" /><path class="muted-icon" d="m16 9 6 6m0-6-6 6" /><path class="sound-icon" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></svg></button>
        <button id="fullscreen" type="button" data-label="fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" /></svg></button>
      </div>
    </div>
  </section>
</body>
</html>
