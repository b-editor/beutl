name: beutl-observability

# Every image is pinned to a release tag.  This compose file is a local and
# staging reference stack; production credentials, TLS, backups, and HA are
# deliberately managed outside this repository.
x-image-versions:
  clickhouse: &clickhouse-image clickhouse/clickhouse-server:25.3.2.39-alpine
  tempo: &tempo-image grafana/tempo:2.7.2
  loki: &loki-image grafana/loki:3.4.2
  prometheus: &prometheus-image prom/prometheus:v3.1.0
  grafana: &grafana-image grafana/grafana:11.5.2

services:
  clickhouse:
    image: *clickhouse-image
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    networks: [telemetry-backend]
    healthcheck:
      # The server image contains clickhouse-client; using it avoids relying
      # on an optional wget implementation in the minimal Alpine image.
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  tempo:
    image: *tempo-image
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [telemetry-backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  loki:
    image: *loki-image
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [telemetry-backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  otel-collector:
    image: beutl/otel-collector-contrib:0.120.0
    build:
      context: .
      dockerfile: collector.Dockerfile
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP/gRPC ingress
      - "127.0.0.1:4318:4318" # OTLP/HTTP ingress
    networks: [telemetry-edge, telemetry-backend]
    depends_on:
      clickhouse:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "--spider", "--quiet", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: *prometheus-image
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=395d
      # A short lookback makes the timestamp regression deterministic: quality
      # samples remain current only when the exporter omits source timestamps.
      - --query.lookback-delta=1m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [telemetry-backend]
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  analytics-rollup:
    image: *clickhouse-image
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/beutl/recompute-loop.sh"]
    volumes:
      - ./clickhouse/recompute.sql:/opt/beutl/recompute.sql:ro
      - ./clickhouse/recompute-loop.sh:/opt/beutl/recompute-loop.sh:ro
      - ./clickhouse/rollup-health.sh:/opt/beutl/rollup-health.sh:ro
    networks: [telemetry-backend]
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/beutl/rollup-health.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: *grafana-image
    restart: unless-stopped
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in docker/otel-collector/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Pin the external ClickHouse data-source plugin as well as the image.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.6.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [telemetry-edge, telemetry-backend]
    depends_on:
      clickhouse:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

networks:
  telemetry-edge:
    driver: bridge
  telemetry-backend:
    driver: bridge
    internal: true

volumes:
  clickhouse-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
