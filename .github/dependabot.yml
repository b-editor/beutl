# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # No target-branch here: main is the default branch, and with target-branch set the ignores below
  # would not apply to security updates.
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Minor and patch updates arrive as one pull request; a major update still gets its own.
    groups:
      nuget-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    # The bundled libSkiaSharp is built from a fork pinned to one SkiaSharp version, and the build fails
    # for any other (native/SkiaSharp/Beutl.Engine.targets), so these packages move with the fork.
    ignore:
      - dependency-name: "SkiaSharp*"
      - dependency-name: "HarfBuzzSharp*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: daily

  # Follows the branch each submodule declares in .gitmodules (beutl for both forks).
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
