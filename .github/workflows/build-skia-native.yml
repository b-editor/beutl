# This workflow is managed by gh actions-lock.

name: Build libSkiaSharp

on:
  workflow_dispatch:
    inputs:
      rids:
        type: string
        default: '["linux-x64", "linux-arm64", "win-x64", "win-arm64", "osx"]'
      artifact-prefix:
        type: string
        default: skia-native

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ fromJSON(inputs.rids) }}
    runs-on: ${{ matrix.rid == 'linux-arm64' && 'ubuntu-22.04-arm' || startsWith(matrix.rid, 'win-') && 'windows-latest' || matrix.rid == 'osx' && 'macos-latest' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore native binary cache
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: native/SkiaSharp/artifacts/runtimes/${{ matrix.rid }}
          key: skia-native-v1-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('native/SkiaSharp/source.json', 'native/SkiaSharp/build.py', 'native/SkiaSharp/patches.py', 'native/SkiaSharp/vulkan-image-layout.patch', 'native/SkiaSharp/libSkiaSharp.map') }}-${{ startsWith(matrix.rid, 'linux-') && hashFiles('native/SkiaSharp/fontconfig-missing-family.patch') || 'no-fontconfig' }}-${{ matrix.rid == 'osx' && hashFiles('native/SkiaSharp/macos-linker-version.patch') || 'no-macos' }}-${{ startsWith(matrix.rid, 'win-') && hashFiles('native/SkiaSharp/freetype-fontmgr.patch') || 'no-freetype' }}

      - name: Install Linux build dependencies
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build libfontconfig1-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install macOS build dependencies
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ninja

      - name: Configure Windows compiler
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          $arch = '${{ matrix.rid }}'.Substring(4)
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=x64"
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSINSTALLDIR')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }

      - name: Build pinned Skia and verify exports
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 native/SkiaSharp/build.py --rid ${{ matrix.rid }} --output-dir native/SkiaSharp/artifacts

      - name: Verify native runtime
        run: python3 native/SkiaSharp/verify.py --rid ${{ matrix.rid }} --native-root native/SkiaSharp/artifacts

      - name: Test Fontconfig initialization
        if: runner.os == 'Linux'
        run: python3 native/SkiaSharp/test_fontconfig.py --native-root native/SkiaSharp/artifacts -v

      - name: Upload native runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.rid }}
          path: native/SkiaSharp/artifacts/
          if-no-files-found: error
