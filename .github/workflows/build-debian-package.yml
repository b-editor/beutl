# This workflow is managed by gh actions-lock.

name: Build Debian Package

on:
  workflow_call:
    inputs:
      semVer:
        required: true
        type: string
      simpleVer:
        required: true
        type: string
      revision:
        required: true
        type: string
    outputs:
      artifact-run-id:
        description: Run ID that published the artifacts
        value: ${{ jobs.build-debian-package.outputs.artifact-run-id }}

jobs:
  build-debian-package:
    runs-on: ubuntu-latest
    outputs:
      artifact-run-id: ${{ steps.run-id.outputs.run-id }}
    strategy:
      matrix:
        include:
          - arch: x64
            deb-arch: amd64
          - arch: arm64
            deb-arch: arm64

    steps:
      - name: Set artifact run id
        id: run-id
        run: echo "run-id=${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8.0.1
        with:
          name: beutl-linux_${{ matrix.arch }}-standalone-${{ inputs.semVer }}
          path: artifacts

      - name: Extract zip
        run: |
          cd packages/ubuntu22.04/usr
          mkdir -p lib/beutl
          cd lib/beutl
          unzip ${{ github.workspace }}/artifacts/Beutl-linux-${{ matrix.arch }}-standalone-${{ inputs.semVer }}.zip

      - name: Update Metadata
        shell: bash
        run: |
          cd packages/ubuntu22.04/usr/lib/beutl
          ASSET_METADATA_ID=`uuidgen`
          cat asset_metadata.json | jq --arg id "$ASSET_METADATA_ID" '. .id=$id | .type="debian"' > asset_metadata_tmp.json
          mv asset_metadata_tmp.json asset_metadata.json
          cat asset_metadata.json

      - name: Change mode
        run: |
          cd packages/ubuntu22.04/usr/lib/beutl
          chmod +x Beutl
          chmod +x Beutl.ExceptionHandler
          chmod +x Beutl.PackageTools.UI

      - name: Symbolic Link
        run: |
          cd packages/ubuntu22.04
          mkdir usr/bin
          ln -s /usr/lib/beutl/Beutl usr/bin/beutl

      - name: Set Architecture and Version
        run: |
          cd packages/ubuntu22.04/DEBIAN
          echo "Architecture: ${{ matrix.deb-arch }}" >> control
          echo "Version: ${{ inputs.simpleVer }}-${{ inputs.revision }}ubuntu22.04" >> control

      - name: Set Installed-Size
        run: |
          SizeInKiloBytes=`du -s -k packages/ubuntu22.04 | awk '{print $1}'`
          cd packages/ubuntu22.04/DEBIAN
          echo "Installed-Size: $SizeInKiloBytes" >> control

      - name: Build package
        run: |
          cd packages
          fakeroot dpkg-deb --build ubuntu22.04 .

      - name: Save package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ubuntu22.04_${{ matrix.deb-arch }}
          path: ./packages/beutl_${{ inputs.simpleVer }}-${{ inputs.revision }}ubuntu22.04_${{ matrix.deb-arch }}.deb
          if-no-files-found: error
