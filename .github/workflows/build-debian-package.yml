# This workflow is managed by gh actions-lock.

name: Build Debian Package

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      semVer:
        required: true
        type: string
      simpleVer:
        required: true
        type: string
      revision:
        required: true
        type: string

jobs:
  build-debian-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: beutl-linux_${{ matrix.arch }}-standalone-${{ inputs.semVer }}
          path: artifacts

      - name: Extract zip
        run: |
          cd packages/debian/usr
          mkdir -p lib/beutl
          cd lib/beutl
          unzip ${{ github.workspace }}/artifacts/Beutl-linux-${{ matrix.arch }}-standalone-${{ inputs.semVer }}.zip

      - name: Update Metadata
        shell: bash
        run: |
          cd packages/debian/usr/lib/beutl
          ASSET_METADATA_ID=`uuidgen`
          cat asset_metadata.json | jq --arg id "$ASSET_METADATA_ID" '. .id=$id | .type="debian"' > asset_metadata_tmp.json
          mv asset_metadata_tmp.json asset_metadata.json
          cat asset_metadata.json

      - name: Change mode
        run: |
          cd packages/debian/usr/lib/beutl
          chmod +x Beutl
          chmod +x Beutl.ExceptionHandler
          chmod +x Beutl.PackageTools.UI

      - name: Symbolic Link
        run: |
          cd packages/debian
          mkdir usr/bin
          ln -s /usr/lib/beutl/Beutl usr/bin/beutl

      - name: Set Architecture and Version
        run: |
          cd packages/debian/DEBIAN
          echo "Architecture: ${{ matrix.deb-arch }}" >> control
          echo "Version: ${{ inputs.simpleVer }}-${{ inputs.revision }}" >> control

      - name: Set Installed-Size
        run: |
          SizeInKiloBytes=`du -s -k packages/debian | awk '{print $1}'`
          cd packages/debian/DEBIAN
          echo "Installed-Size: $SizeInKiloBytes" >> control

      - name: Build package
        run: |
          cd packages
          fakeroot dpkg-deb --build debian .

      - name: Save package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: debian_${{ matrix.deb-arch }}
          path: ./packages/beutl_${{ inputs.simpleVer }}-${{ inputs.revision }}_${{ matrix.deb-arch }}.deb
          if-no-files-found: error

  install-test:
    needs: build-debian-package
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: debian_${{ matrix.platform.arch }}
          path: package

      - name: Install the package and check its native dependencies
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" \
            bash -c 'bash build/test_debian_package.sh ./package/beutl_*.deb'
