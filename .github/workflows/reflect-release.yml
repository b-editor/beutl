# This workflow is managed by gh actions-lock.

name: Reflect Release to beutl-reflect-release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  reflect:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      API_BASE: https://release.api.beutl.beditor.net
    steps:
      - name: Resolve version
        id: ver
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "ver=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const token = await core.getIDToken('https://github.com/b-editor/beutl');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Build asset payload
        id: payload
        env:
          ASSETS: ${{ toJSON(github.event.release.assets) }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail

          # One row per registered asset: the release asset (or the label of a "pattern"), and the id after
          # beutl-<version>-. Only self-contained builds ship (#2887), so every registered asset is standalone.
          rows=$(echo "$ASSETS" | jq -c --arg ver "$VER" '
            . as $assets
            | [
                {name: "beutl-standalone-setup.exe", id: "win-x64-installer-standalone", os: "win", arch: "x64", type: "installer"},
                {name: "beutl-standalone-arm64-setup.exe", id: "win-arm64-installer-standalone", os: "win", arch: "arm64", type: "installer"},
                {name: "beutl_*_amd64.deb", pattern: "^beutl_.*_amd64\\.deb$", id: "linux-x64-debian", os: "linux", arch: "x64", type: "debian"},
                {name: "Beutl-linux-x64-standalone-\($ver).zip", id: "linux-x64-zip-standalone", os: "linux", arch: "x64", type: "zip"},
                {name: "Beutl-\($ver).flatpak", id: "linux-x64-flatpak", os: "linux", arch: "x64", type: "flatpak"},
                {name: "beutl_*_arm64.deb", pattern: "^beutl_.*_arm64\\.deb$", id: "linux-arm64-debian", os: "linux", arch: "arm64", type: "debian"},
                {name: "Beutl-linux-arm64-standalone-\($ver).zip", id: "linux-arm64-zip-standalone", os: "linux", arch: "arm64", type: "zip"},
                {name: "Beutl-arm64-\($ver).flatpak", id: "linux-arm64-flatpak", os: "linux", arch: "arm64", type: "flatpak"},
                {name: "Beutl.osx_x64.app.zip", id: "osx-x64-app", os: "osx", arch: "x64", type: "app"},
                {name: "Beutl.osx_arm64.app.zip", id: "osx-arm64-app", os: "osx", arch: "arm64", type: "app"}
              ]
            | map(. as $row
                | .url = ([$assets[] | select(if $row.pattern then .name | test($row.pattern) else .name == $row.name end)][0].browser_download_url // ""))')

          missing=0
          while IFS=$'\t' read -r name url; do
            if [ -z "$url" ]; then
              echo "::error::missing asset: $name"
              missing=1
            else
              echo "$name -> $url"
            fi
          done < <(echo "$rows" | jq -r '.[] | [.name, .url] | @tsv')
          [ "$missing" -eq 0 ] || exit 1

          body=$(echo "$rows" | jq -c --arg ver "$VER" \
            '{assets: map({id: "beutl-\($ver)-\(.id)", version: $ver, os, arch, type, standalone: true, url})}')

          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing assets for version (idempotency)
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          status=$(curl -sS -o /tmp/del.out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "$API_BASE/releases/version/$VER")
          echo "DELETE status: $status"
          cat /tmp/del.out || true
          case "$status" in
            2*|404) ;;
            *) echo "::error::unexpected DELETE status $status"; exit 1 ;;
          esac

      - name: Bulk register assets
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          BODY: ${{ steps.payload.outputs.body }}
        run: |
          status=$(curl -sS -o /tmp/post.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_BASE/releases/bulk")
          echo "POST status: $status"
          cat /tmp/post.out || true
          case "$status" in
            2*) ;;
            *) echo "::error::bulk register failed with status $status"; exit 1 ;;
          esac
