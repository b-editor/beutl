# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (build and upload artifacts only, skip GitHub Release creation)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  determine-version:
    uses: ./.github/workflows/build-version.yml

  build-executable:
    needs: [ determine-version ]
    uses: ./.github/workflows/build-executable.yml
    with:
      rids: ${{ toJSON(fromJSON(needs.determine-version.outputs.releaseMatrices).executables) }}
      semVer: ${{ needs.determine-version.outputs.semVer }}
      nugetVer: ${{ needs.determine-version.outputs.nugetVer }}
      asmVer: ${{ needs.determine-version.outputs.asmVer }}
      infoVer: ${{ needs.determine-version.outputs.infoVer }}

  build-windows-installer:
    needs: [ determine-version, build-executable ]
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      architectures: ${{ toJSON(fromJSON(needs.determine-version.outputs.releaseMatrices).installers) }}
      semVer: ${{ needs.determine-version.outputs.semVer }}
      asmVer: ${{ needs.determine-version.outputs.asmVer }}

  build-debian-package:
    needs: [ determine-version, build-executable ]
    uses: ./.github/workflows/build-debian-package.yml
    with:
      platforms: ${{ toJSON(fromJSON(needs.determine-version.outputs.releaseMatrices).debian) }}
      semVer: ${{ needs.determine-version.outputs.semVer }}
      simpleVer: ${{ needs.determine-version.outputs.simpleVer }}
      revision: ${{ needs.determine-version.outputs.revision }}

  build-flatpak-package:
    needs: [ determine-version, build-executable ]
    uses: ./.github/workflows/build-flatpak-package.yml
    with:
      platforms: ${{ toJSON(fromJSON(needs.determine-version.outputs.releaseMatrices).flatpak) }}
      semVer: ${{ needs.determine-version.outputs.semVer }}
      nugetVer: ${{ needs.determine-version.outputs.nugetVer }}

  build-app-bundle:
    needs: [ determine-version ]
    uses: ./.github/workflows/build-macos-app.yml
    with:
      rids: ${{ toJSON(fromJSON(needs.determine-version.outputs.releaseMatrices).macos) }}
      semVer: ${{ needs.determine-version.outputs.semVer }}
      nugetVer: ${{ needs.determine-version.outputs.nugetVer }}
      asmVer: ${{ needs.determine-version.outputs.asmVer }}
      infoVer: ${{ needs.determine-version.outputs.infoVer }}
    secrets:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}

  build-nuget:
    needs: [ determine-version ]
    uses: ./.github/workflows/build-nuget.yml
    with:
      nugetVer: ${{ needs.determine-version.outputs.nugetVer }}
      asmVer: ${{ needs.determine-version.outputs.asmVer }}
      infoVer: ${{ needs.determine-version.outputs.infoVer }}

  create-release:
    if: ${{ github.event_name == 'push' || github.event.inputs['dry-run'] != 'true' }}
    needs: [ determine-version, build-executable, build-windows-installer, build-debian-package, build-flatpak-package, build-nuget, build-app-bundle ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        id: assets
        env:
          VERSION: ${{ needs.determine-version.outputs.semVer }}
          DEB_VERSION: ${{ needs.determine-version.outputs.simpleVer }}-${{ needs.determine-version.outputs.revision }}
        run: |
          files=$(python3 .github/scripts/release_assets.py uploads artifacts "$VERSION" "$DEB_VERSION")
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@v1.21.0
        id: create_release
        with:
          artifacts: ${{ steps.assets.outputs.files }}
          draft: true
          makeLatest: true
          generateReleaseNotes: true

      - name: Trigger release notes formatting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run format-release-notes.yml \
            -R ${{ github.repository }} \
            --ref main \
            -f tag=v${{ needs.determine-version.outputs.semVer }} \
            -f semVer=${{ needs.determine-version.outputs.semVer }} \
            -f simpleVer=${{ needs.determine-version.outputs.simpleVer }} \
            -f revision=${{ needs.determine-version.outputs.revision }}
