# This workflow is managed by gh actions-lock.

name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer PR revision supersedes its previous checks. Keep main runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}

    steps:
      # Some runner images have little free disk space; others have over 80 GB.
      # Keep the low-disk safeguard without spending minutes deleting unused tools
      # when the runner already has enough room for restore, build and its archive.
      - name: Free disk space
        run: |
          df -h /
          available_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( available_kb >= 30 * 1024 * 1024 )); then
            echo "At least 30 GB is available; skipping disk cleanup."
            exit 0
          fi
          printf '%s\0' /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            | xargs -0 -n 1 -P 4 sudo rm -rf
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Verify bundled libSkiaSharp
        run: |
          python3 -m unittest discover -s native/SkiaSharp -p 'test_*.py'
          python3 native/SkiaSharp/verify.py

      - name: Resolve .NET SDK version
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Verify test sharding
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.nuget/packages
          key: dotnet-nuget-v1-${{ runner.os }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '!**/obj/**', '!**/bin/**') }}
          restore-keys: |
            dotnet-nuget-v1-${{ runner.os }}-${{ steps.dotnet-sdk.outputs.version }}-

      - name: Restore .NET build cache
        id: build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            **/obj
          key: dotnet-obj-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('global.json') }}-${{ github.sha }}
          restore-keys: |
            dotnet-obj-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('global.json') }}-

      # Git checks out every source file with a fresh mtime while actions/cache preserves
      # the original mtimes of obj/. Without correcting this, MSBuild sees every source as
      # newer than the restored intermediate outputs and recompiles the whole solution.
      # Make unchanged tracked inputs old, then touch only files changed since the cache's
      # source commit. Deletions and submodule changes conservatively force a full rebuild.
      - name: Prepare incremental build timestamps
        if: steps.build-cache.outputs.cache-matched-key != ''
        shell: bash
        env:
          CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          CACHED_SHA="${CACHE_KEY##*-}"
          clear_cache() {
            echo "Discarding restored obj cache; its source commit cannot be compared safely."
            find . -type d -name obj -prune -exec rm -rf {} +
          }

          if [[ ! "$CACHED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            clear_cache
            exit 0
          fi

          if ! git cat-file -e "${CACHED_SHA}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$CACHED_SHA"; then
              clear_cache
              exit 0
            fi
          fi

          OLD_TIMESTAMP='2000-01-01 00:00:00 UTC'
          git ls-files -z | xargs -0 -r touch -h -d "$OLD_TIMESTAMP"
          git submodule foreach --recursive \
            'git ls-files -z | xargs -0 -r touch -h -d "2000-01-01 00:00:00 UTC"'

          if ! git diff --quiet --no-renames --diff-filter=D "$CACHED_SHA" HEAD -- \
            || git diff --raw "$CACHED_SHA" HEAD -- | awk '$1 == ":160000" || $2 == "160000" { found = 1 } END { exit !found }'; then
            echo "A tracked file was deleted or a submodule changed; forcing a full rebuild."
            git ls-files -z | xargs -0 -r touch -h
            git submodule foreach --recursive 'git ls-files -z | xargs -0 -r touch -h'
          else
            while IFS= read -r -d '' file; do
              if [[ -e "$file" || -L "$file" ]]; then
                touch -h "$file"
              fi
            done < <(git diff --name-only -z --diff-filter=ACMRTUXB "$CACHED_SHA" HEAD --)
          fi

      - name: Restore dependencies
        run: dotnet restore Beutl.slnx

      - name: Build
        run: dotnet build Beutl.slnx --no-restore

      - name: Save .NET build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            **/obj
          key: dotnet-obj-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('global.json') }}-${{ github.sha }}

      - name: Save NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.nuget/packages
          key: dotnet-nuget-v1-${{ runner.os }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '!**/obj/**', '!**/bin/**') }}

      # Archive test outputs once, including their copied app/worker dependencies.
      # Subprocess tests launch their own assembly or the worker copied next to it.
      # tar preserves executable bits; test jobs run DLLs directly, so they need no
      # obj directories, package restore or repeated solution build. The SDK's
      # RID graph preserves host-compatible native/managed fallbacks while other
      # platforms' assets are omitted from this Linux-only test artifact.
      - name: Archive test binaries
        run: |
          coverlet_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(next(p.attrib["Version"] for p in ET.parse("Directory.Packages.props").iter("PackageVersion") if p.attrib.get("Include") == "coverlet.collector"))')
          mkdir -p .ci-tools
          cp -a "$HOME/.nuget/packages/coverlet.collector/$coverlet_version/build/net10.0" .ci-tools/coverlet
          python3 .github/scripts/archive_ci.py --rid linux-x64 \
            --runtime-graph "$DOTNET_ROOT/sdk/$(dotnet --version)/PortableRuntimeIdentifierGraph.json" \
            | tar --null -T - -I 'zstd -T0 -1' -cf "$RUNNER_TEMP/test-binaries.tar.zst"
          du -h "$RUNNER_TEMP/test-binaries.tar.zst"

      - name: Share test binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TestBinaries
          path: ${{ runner.temp }}/test-binaries.tar.zst
          compression-level: 0
          retention-days: 1

  test:
    needs: compile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit-particles, unit-golden, unit-rendering, unit-audio, unit-engine, unit-git, unit-other, ui-a-d, ui-e-m, ui-n-r, ui-other, graphics3d, other]
        validation: [false]
        # Every unit and Graphics3D test still runs both normally and under Vulkan
        # validation. Namespace partitions are exhaustive, including untagged GPU
        # tests; unrelated test assemblies run in the "other" catch-all suite.
        include:
          - suite: validation-core
            validation: true
          - suite: validation-rendering
            validation: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ needs.compile.outputs.dotnet-version }}

      - name: Download test binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: TestBinaries
          path: ${{ runner.temp }}/test-binaries

      - name: Extract test binaries
        run: tar --zstd -xf "$RUNNER_TEMP/test-binaries/test-binaries.tar.zst"

      - name: Install Vulkan validation layers
        if: matrix.validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vulkan-validationlayers

      - name: Test
        run: python3 .github/scripts/ci_tests.py "$TEST_SUITE" ${{ matrix.validation && '--validation' || '' }}
        env:
          TEST_SUITE: ${{ matrix.suite }}
          BEUTL_REQUIRE_GPU: "1"
          BEUTL_VULKAN_VALIDATION: ${{ matrix.validation && '1' || '0' }}

      - name: Capture runner diagnostics after failure
        if: failure()
        run: |
          mkdir -p TestResults/ci-diagnostics
          free -h > TestResults/ci-diagnostics/memory.log
          df -h > TestResults/ci-diagnostics/disk.log
          ps -eo pid,ppid,comm,rss,etimes > TestResults/ci-diagnostics/processes.log
          sudo dmesg --ctime 2>&1 | tee TestResults/ci-diagnostics/kernel.log > /dev/null || true

      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TestDiagnostics-${{ matrix.suite }}-${{ matrix.validation && 'validation' || 'coverage' }}
          path: |
            TestResults/**/*.trx
            TestResults/**/Sequence_*.xml
            TestResults/**/*.dmp
            TestResults/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save coverage reports
        if: ${{ !matrix.validation }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Coverage-${{ matrix.suite }}
          path: |
            TestResults/**/coverage.cobertura.xml
            !TestResults/**/In/**
          if-no-files-found: error
          retention-days: 1

  # Preserve the required "build" check: it must include every test shard, even
  # if compile fails or a dependency is skipped. A compile-only green check would
  # let existing branch protection admit revisions whose tests failed.
  build:
    if: always()
    needs: [compile, test]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and tests
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success

  macos-font-tests:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Test shortcut fonts and emoji on macOS
        run: >-
          dotnet test tests/Beutl.HeadlessUITests/Beutl.HeadlessUITests.csproj
          --configuration Release -f net10.0
          --filter "FullyQualifiedName~UIFontResourceTests|FullyQualifiedName~CommandPaletteViewLayoutTests.Shortcut_font"
          --logger trx --results-directory TestResults/macos-fonts

      - name: Test shared font configuration on macOS
        run: >-
          dotnet test tests/Beutl.E2ETests/Beutl.E2ETests.csproj
          --configuration Release -f net10.0 --filter FullyQualifiedName~Controls.UiFontsTests
          --logger trx --results-directory TestResults/macos-fonts

      - name: Save font test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MacOSFontTestDiagnostics
          path: TestResults/macos-fonts/
          if-no-files-found: ignore
          retention-days: 7

  mediafoundation-tests:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Test Media Foundation on Windows x64
        run: >-
          dotnet test tests/Beutl.Extensions.MediaFoundation.Tests/Beutl.Extensions.MediaFoundation.Tests.csproj
          --configuration Release -f net10.0 -p:PlatformTarget=x64
          --logger trx --results-directory TestResults/mediafoundation
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini
          --blame-crash --blame-crash-dump-type mini

      - name: Save Media Foundation test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MediaFoundationTestDiagnostics
          path: TestResults/mediafoundation/
          if-no-files-found: ignore
          retention-days: 7

  upload-coverage:
    needs: [build, compile]
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ needs.compile.outputs.dotnet-version }}

      - name: Download coverage reports
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Coverage-*
          path: coverage-shards

      - name: Merge coverage reports
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage-shards/**/coverage.cobertura.xml" -targetdir:coveragereport -reporttypes:"Cobertura;Html"

      - name: Save merged coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Coverage
          path: coveragereport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coveragereport/Cobertura.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
