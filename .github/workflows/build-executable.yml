# This workflow is managed by gh actions-lock.

name: Build Executable

on:
  workflow_call:
    inputs:
      semVer:
        required: true
        type: string
      nugetVer:
        required: true
        type: string
      asmVer:
        required: true
        type: string
      infoVer:
        required: true
        type: string
      # Only self-contained builds ship (#2887). The Windows zips feed build-windows-installer.yml,
      # and macOS ships the signed app from build-macos-app.yml.
      rids:
        description: The Nuke runtimes to build, as a JSON array.
        required: false
        type: string
        default: '["linux_x64", "linux_arm64", "win_x64", "win_arm64"]'
      selfContained:
        required: false
        type: boolean
        default: true
      metadata:
        description: Whether to write asset_metadata.json.
        required: false
        type: boolean
        default: true
      artifactName:
        description: The artifact name, where {0} is the runtime and {1} the version.
        required: false
        type: string
        default: 'beutl-{0}-standalone-{1}'

jobs:
  build-executable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: ${{ fromJSON(inputs.rids) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Verify bundled libSkiaSharp
        run: python3 native/SkiaSharp/verify.py

      - name: Restore
        run: |
          chmod +x build.sh
          ./build.sh restore --runtime ${{ matrix.rid }}

      - name: Publish
        run: |
          ./build.sh publish \
            --self-contained ${{ inputs.selfContained }} \
            --runtime ${{ matrix.rid }} \
            --skip restore \
            --version ${{ inputs.nugetVer }} \
            --assembly-version ${{ inputs.asmVer }} \
            --informational-version ${{ inputs.infoVer }}

      # Cross-architecture publishes (e.g. linux_arm64 on this x64 runner) must not ship the host's libraries.
      - name: Verify native architecture
        run: python3 build/verify_native_architecture.py --rid ${{ matrix.rid }} output/Beutl

      # Only the linux_x64 output runs on this runner. Starting the FFmpeg worker and the MCP host from it
      # catches a file that the merge into output/Beutl left out, which the build does not notice (#2887).
      - name: Smoke-test the FFmpeg worker and the MCP host
        if: matrix.rid == 'linux_x64'
        run: python3 build/smoke_test_output.py output/Beutl

      - name: Store Metadata
        if: inputs.metadata
        run: |
          cd output/Beutl
          ASSET_METADATA_ID=`uuidgen`
          ASSET_METADATA_OS=`echo ${{ matrix.rid }} | cut -d '_' -f 1`
          ASSET_METADATA_ARCH=`echo ${{ matrix.rid }} | cut -d '_' -f 2`
          ASSET_METADATA_VERSION=${{ inputs.semVer }}
          ASSET_METADATA_STANDALONE=true
          ASSET_METADATA_TYPE=zip
          echo '{}' | jq \
             --arg id $ASSET_METADATA_ID \
             --arg os $ASSET_METADATA_OS \
             --arg arch $ASSET_METADATA_ARCH \
             --arg version $ASSET_METADATA_VERSION \
             --arg standalone $ASSET_METADATA_STANDALONE \
             --arg type $ASSET_METADATA_TYPE \
            '.id=$id | .os=$os | .arch=$arch | .version=$version | .standalone=$standalone | .type=$type' > asset_metadata.json
          cat asset_metadata.json

      - name: Zip
        run: |
          ./build.sh zip \
            --runtime ${{ matrix.rid }} \
            --self-contained ${{ inputs.selfContained }} \
            --skip publish \
            --version ${{ inputs.nugetVer }}

      - name: Save
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ format(inputs.artifactName, matrix.rid, inputs.semVer) }}
          path: ./artifacts/*.zip
