# This workflow is managed by gh actions-lock.

name: Publish NuGet Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Validate NuGet configuration
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_SOURCE" ]; then
            echo "::error::Set the NUGET_SOURCE repository secret to the NuGet feed URL."
            exit 1
          fi
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Set the NUGET_API_KEY repository secret to the publishing API key."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download NuGet release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' \
            --dir packages

      - name: Push NuGet packages
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source "$NUGET_SOURCE" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate \
            --no-symbols
