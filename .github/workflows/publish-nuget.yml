# This workflow is managed by gh actions-lock.

name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.0.0-preview.9)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Validate NuGet configuration
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_SOURCE" ]; then
            echo "::error::Set the NUGET_SOURCE repository secret to the NuGet feed URL."
            exit 1
          fi
          case "$NUGET_SOURCE" in
            [Hh][Tt][Tt][Pp][Ss]://*) ;;
            *)
              echo "::error::NUGET_SOURCE must use HTTPS."
              exit 1
              ;;
          esac
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Set the NUGET_API_KEY repository secret to the publishing API key."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download NuGet release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' \
            --dir packages

      - name: Push NuGet packages
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # The feed can answer 500 for a package it went on to store, and dotnet gives up after its own three tries. Give
          # each package more tries of its own, and let one that still fails leave the others to be pushed.
          failed=0
          for package in packages/*.nupkg; do
            pushed=false
            for attempt in 1 2 3 4 5; do
              if dotnet nuget push "$package" \
                --source "$NUGET_SOURCE" \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate \
                --no-symbols; then
                pushed=true
                break
              fi
              echo "::warning::Push attempt $attempt of $(basename "$package") failed."
              sleep $((attempt * 15))
            done
            if [ "$pushed" = false ]; then
              echo "::error::Could not push $(basename "$package")."
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify the packages on the feed
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        run: |
          # The feed registers a version before it stores the file, so a retry can report a duplicate for a package whose
          # upload failed. Only what the feed serves shows that the file arrived.
          base=$(curl -fsSL "$NUGET_SOURCE" | jq -r '.resources[] | select(."@type" | startswith("PackageBaseAddress")) | ."@id"' | head -n 1)
          if [ -z "$base" ]; then
            echo "::warning::The source has no package base address, so the published packages were not verified."
            exit 0
          fi
          failed=0
          for package in packages/*.nupkg; do
            name=$(basename "$package" .nupkg | tr '[:upper:]' '[:lower:]')
            id=$(printf '%s' "$name" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+.*$//')
            version=${name#"$id".}
            if ! curl -fsSL --retry 3 --retry-delay 5 -o served.nupkg "${base%/}/$id/$version/$name.nupkg"; then
              echo "::error::$(basename "$package") could not be downloaded from the feed."
              failed=1
            elif ! cmp -s "$package" served.nupkg; then
              echo "::error::The feed serves a different $(basename "$package")."
              failed=1
            fi
          done
          exit "$failed"
