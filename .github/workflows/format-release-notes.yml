name: Format Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0-preview.3)"
        required: true
        type: string
      semVer:
        description: "SemVer without the leading v (e.g. 2.0.0-preview.3)"
        required: true
        type: string
      simpleVer:
        description: "Simple version (e.g. 2.0.0)"
        required: true
        type: string
      revision:
        description: "Version revision number (e.g. 89)"
        required: true
        type: string

# opencode only writes the categorized summary as JSON, in a job that holds no GitHub
# token scopes and no GitHub secrets. The jobs around it read and edit the release with gh.
permissions: {}

env:
  TAG: ${{ inputs.tag }}
  SEM_VER: ${{ inputs.semVer }}
  SIMPLE_VER: ${{ inputs.simpleVer }}
  REVISION: ${{ inputs.revision }}
  REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only to tokens that can write to the repository.
      contents: write
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      body-sha256: ${{ steps.release.outputs.body-sha256 }}
    steps:
      - &read-release
        name: Read the release notes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" --json body,isDraft > release.json
          jq -j '.body // ""' release.json > body.raw
          tr -d '\r' < body.raw > body.md
          echo "body-sha256=$(sha256sum < body.raw | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          downloads="https://github.com/$REPO/releases/download/$TAG"
          if grep -qF "$downloads/Beutl-$SEM_VER.flatpak" body.md; then
            mode=formatted
          elif grep -qF "$downloads/" body.md; then
            # Formatted by an older revision of this workflow, before the Flatpak link existed.
            mode=repair
          else
            mode=format
            # Split GitHub's auto-generated notes. Anything else in them is left for a human.
            : > changelog.md
            : > contributors.md
            : > full-changelog.md
            if ! awk -v changes="## What's Changed" -v contributors="## New Contributors" '
              { sub(/[[:space:]]+$/, "") }
              $0 == changes { section = "changes"; next }
              $0 == contributors { section = "contributors"; next }
              /^\*\*Full Changelog\*\*: / { print > "full-changelog.md"; section = ""; next }
              $0 == "" { next }
              section == "changes" && /^\* / { print > "changelog.md"; next }
              section == "contributors" && /^\* / { print > "contributors.md"; next }
              { print "Unexpected line: " $0 > "/dev/stderr"; unexpected = 1 }
              END { exit unexpected }
            ' body.md; then
              echo "::error::The notes of $TAG are neither auto-generated nor formatted by this workflow; format them by hand."
              exit 1
            fi
            if [ ! -s changelog.md ]; then
              echo "::error::The auto-generated notes of $TAG list no pull requests to summarize."
              exit 1
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release notes of $TAG: $mode"

      - name: Upload the changelog for opencode
        if: steps.release.outputs.mode == 'format'
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 1
          if-no-files-found: error
          # A re-run uploads the artifact again.
          overwrite: true

  summarize:
    needs: prepare
    if: needs.prepare.outputs.mode == 'format'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: ${{ runner.temp }}/input

      - name: Install opencode
        run: npm install --global opencode-ai@1.18.32

      - name: Summarize the changelog with opencode
        timeout-minutes: 20
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Any OpenCode Zen model (opencode/...) can replace the default through the OPENCODE_MODEL variable.
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/claude-sonnet-5' }}
          # Every tool but the edit tools is hidden from the model, and those may touch only
          # summary.json in the working directory: anything outside it is an external_directory
          # request, which "*" denies.
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "*": "deny",
                "edit": { "*": "deny", "*/summary.json": "allow" }
              }
            }
          PROMPT: |
            You are writing the categorized summary for the release notes of Beutl ${{ inputs.tag }}, a video editing application. The <changelog> below is GitHub's auto-generated list of the pull requests in this release, one `* <PR title> by @<author> in <PR URL>` line each.

            Produce a JSON object with exactly these four keys, each an array of bullets:
            - "newFeatures": PR titles starting with `feat:` / `feature:`
            - "improvements": `refactor:` / `perf:` / `improve:` / `chore(refactor):` style
            - "bugFixes": `fix:`
            - "other": any other user-visible PR
            A scope or a breaking-change marker does not change the category (`feat(audio)!:` is a new feature). Skip dependabot bumps and pure `chore:` / `ci:` / `build:` / `docs:` / `test:` PRs that have no end-user impact. Leave a category as an empty array when nothing belongs in it.

            A bullet is `{"text": "<change>"}`, or `{"text": "<feature area>", "children": ["<change>", ...]}` to group several PRs that touch one feature area, for example:
            {"newFeatures": [{"text": "Audio", "children": ["Added an audio equalizer effect", "Added waveform shapes to the audio visualizer"]}, {"text": "Added the border design theme (breaking change)"}], "improvements": [], "bugFixes": [{"text": "Fixed a crash when importing video without an audio track"}], "other": []}

            - Describe each user-visible change in past tense, paraphrasing the PR title. Never copy a changelog line verbatim.
            - Merge related PRs into a single bullet when natural.
            - Append " (breaking change)" to a change whose PR title has `!` before the colon.
            - Write plain text: no links, URLs, PR numbers, author names, or line breaks.
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Set the OPENCODE_API_KEY secret to an OpenCode Zen API key."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/opencode"
          cd "$RUNNER_TEMP/opencode"
          {
            printf '%s\n<changelog>\n' "$PROMPT"
            cat "$RUNNER_TEMP/input/changelog.md"
            printf '</changelog>\n\nWrite the JSON object to %s with the write tool, and write no other file.\n' "$PWD/summary.json"
          } | opencode run --pure --model "$OPENCODE_MODEL" --title "Summarize $TAG"
          if [ ! -s summary.json ]; then
            echo "::error::opencode finished without writing summary.json."
            exit 1
          fi

      - name: Upload the summary
        uses: actions/upload-artifact@v7
        with:
          name: summary
          path: ${{ runner.temp }}/opencode/summary.json
          retention-days: 1
          if-no-files-found: error
          # A re-run uploads the artifact again.
          overwrite: true

  apply:
    needs: [prepare, summarize]
    # summarize is skipped when the notes need no new summary.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.summarize.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The prepare step again (YAML alias): it re-reads the release and rebuilds changelog.md,
      # contributors.md and full-changelog.md here instead of trusting another job's artifacts.
      - *read-release

      - name: Download the summary
        if: steps.release.outputs.mode == 'format' && needs.summarize.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: summary
          path: ${{ runner.temp }}/summary

      - name: Update the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.release.outputs.mode }}
          BODY_SHA256: ${{ steps.release.outputs.body-sha256 }}
          SUMMARIZED_SHA256: ${{ needs.prepare.outputs.body-sha256 }}
          SUMMARY: ${{ runner.temp }}/summary/summary.json
        run: |
          set -euo pipefail
          downloads="https://github.com/$REPO/releases/download/$TAG"
          flatpak_url="$downloads/Beutl-$SEM_VER.flatpak"

          if [ "$MODE" = formatted ]; then
            echo "The notes of $TAG are already formatted."
            exit 0
          fi

          if [ "$MODE" = repair ]; then
            # Correct a stale Flatpak href, or add the bullet after the Debian one, and leave the
            # rest of the body alone.
            if ! awk -v url="$flatpak_url" -v debian="[Debian package](" '
              { line[NR] = $0 }
              !flatpak && /^[[:space:]]*[-*+][[:space:]]+\[Flatpak\]\(/ { flatpak = NR }
              !anchor && /^[[:space:]]*[-*+][[:space:]]/ && index($0, debian) { anchor = NR }
              END {
                if (!flatpak && !anchor) exit 1
                for (i = 1; i <= NR; i++) {
                  if (i == flatpak) {
                    start = index(line[i], "[Flatpak](")
                    rest = substr(line[i], start + 10)
                    line[i] = substr(line[i], 1, start - 1) "[Flatpak](" url substr(rest, index(rest, ")"))
                  }
                  print line[i]
                  if (!flatpak && i == anchor) print substr(line[i], 1, index(line[i], debian) - 1) "[Flatpak](" url ")"
                }
              }
            ' body.md > release-body.md; then
              echo "::error::The notes of $TAG have neither a Flatpak nor a Debian package bullet to put the Flatpak link on."
              exit 1
            fi
            args=(--notes-file release-body.md)
            # Repairing a published release must not turn it back into a draft.
            if [ "$(jq -r .isDraft release.json)" = true ]; then
              args+=(--draft=true)
            fi
            gh release edit "$TAG" -R "$REPO" "${args[@]}"
            exit 0
          fi

          if [ ! -f "$SUMMARY" ] || [ "$BODY_SHA256" != "$SUMMARIZED_SHA256" ]; then
            echo "::error::The notes of $TAG changed while they were being summarized. Re-run all jobs."
            exit 1
          fi
          # summary.json is model output: accept only the shape the prompt asked for.
          if ! jq -e '
            def line: type == "string" and test("\\S") and (test("[\\r\\n]|https?://|\\]\\(") | not);
            def bullet: type == "object" and (keys - ["text", "children"] | length == 0)
              and (.text | line) and (.children // [] | type == "array" and all(.[]; line));
            type == "object"
            and keys == ["bugFixes", "improvements", "newFeatures", "other"]
            and all(.[]; type == "array" and all(.[]; bullet))
          ' "$SUMMARY" > /dev/null; then
            echo "::error::opencode wrote a summary.json that does not have the expected shape. Re-run all jobs."
            # Compact JSON is one line starting with "{", so it cannot be read as a workflow command.
            jq -c . "$SUMMARY" || true
            exit 1
          fi

          summary=$(jq -r '
            def trim: gsub("^\\s+|\\s+$"; "");
            def bullets: map("- \(.text | trim)" + (.children // [] | map("\n  - \(trim)") | join("")));
            [["New Features", .newFeatures], ["Improvements & Refactoring", .improvements], ["Bug Fixes", .bugFixes], ["Other", .other]]
            | map(select(.[1] | length > 0) | "**\(.[0])**\n" + (.[1] | bullets | join("\n")))
            | join("\n\n")
          ' "$SUMMARY")
          {
            printf '%s\n' \
              "## What's Changed" \
              "" \
              "- Windows (x64)" \
              "  - [Installer]($downloads/beutl-standalone-setup.exe)" \
              "  - [Installer (.NET Runtime required)]($downloads/beutl-setup.exe)" \
              "- Windows (ARM64)" \
              "  - [Installer]($downloads/beutl-standalone-arm64-setup.exe)" \
              "  - [Installer (.NET Runtime required)]($downloads/beutl-arm64-setup.exe)" \
              "- macOS" \
              "  - [Zip (arm64)]($downloads/Beutl.osx_arm64.app.zip)" \
              "  - [Zip (x64)]($downloads/Beutl.osx_x64.app.zip)" \
              "- Linux" \
              "  - [Debian package]($downloads/beutl_$SIMPLE_VER-${REVISION}ubuntu22.04_amd64.deb)" \
              "  - [Flatpak]($flatpak_url)" \
              "  - [Zip (.NET Runtime required)]($downloads/Beutl-linux-x64-$SEM_VER.zip)" \
              "  - [Zip]($downloads/Beutl-linux-x64-standalone-$SEM_VER.zip)" \
              ""
            # Every category may be empty: a release of dependency bumps and chores has nothing to summarize.
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            fi
            printf '<details>\n<summary>Changelog</summary>\n\n'
            cat changelog.md
            printf '\n</details>\n\n'
            if [ -s contributors.md ]; then
              printf '## New Contributors\n\n'
              cat contributors.md
              echo
            fi
            cat full-changelog.md
          } > release-body.md
          gh release edit "$TAG" -R "$REPO" --notes-file release-body.md --draft=true

      - name: Verify the release notes were reformatted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! body=$(gh release view "$TAG" -R "$REPO" --json body -q .body); then
            echo "::error::Failed to fetch release $TAG to verify its notes (gh release view errored)."
            exit 1
          fi
          if printf '%s' "$body" | grep -qF "releases/download/$TAG/"; then
            echo "Release notes contain the platform download links — reformatting succeeded."
          else
            echo "::error::Release notes for $TAG were not reformatted (no download links found)."
            exit 1
          fi
          flatpak_url="https://github.com/$REPO/releases/download/$TAG/Beutl-$SEM_VER.flatpak"
          if printf '%s' "$body" | grep -qF "$flatpak_url"; then
            echo "Release notes link the Flatpak bundle."
          else
            echo "::error::Release notes for $TAG are missing the Flatpak download link ($flatpak_url)."
            exit 1
          fi
